AutoName: Lloyds Weather
Summary: Minimalist, ad-free weather dashboard with Open-Meteo forecasts and native GPS
Description: |-
  Lloyds Weather is an open-source Android weather application featuring:
  * Accurate hourly and 5-day weather forecasts powered by Open-Meteo
  * Pure device GPS geocoding via Android LocationManager (no Google Play Services required)
  * Clean, edge-to-edge Material Design 3 user interface
  * Celsius and Fahrenheit instant conversion
  * Adaptive layout supporting phones and tablets
  * Zero ads, zero tracking, and complete privacy

